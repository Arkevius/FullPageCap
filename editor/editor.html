<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FullPageCap — Screenshot</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="20" height="20">
        <span id="doc-title">Screenshot</span>
      </div>

      <div class="top-group" id="history-controls">
        <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="M12.5 8H7.83l2.58-2.59L9 4 4 9l5 5 1.41-1.41L7.83 10h4.67a4.5 4.5 0 1 1 0 9H7v2h5.5a6.5 6.5 0 1 0 0-13z"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Y)" disabled>
          <svg viewBox="0 0 24 24"><path d="M11.5 8h4.67l-2.58-2.59L15 4l5 5-5 5-1.41-1.41L16.17 10H11.5a4.5 4.5 0 1 0 0 9H17v2h-5.5a6.5 6.5 0 1 1 0-13z"/></svg>
        </button>
      </div>

      <div class="top-group">
        <button id="btn-zoom-out" class="icon-btn" title="Zoom out (Ctrl+-)">
          <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
        </button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in" class="icon-btn" title="Zoom in (Ctrl++)">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <button id="btn-zoom-fit" class="text-btn" title="Fit to window">Fit</button>
        <button id="btn-zoom-100" class="text-btn" title="Actual size">100%</button>
      </div>

      <div class="spacer"></div>

      <div class="top-group" id="export-controls">
        <button id="btn-copy" class="text-btn" title="Copy image to clipboard">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          Copy
        </button>
        <button id="btn-print" class="text-btn" title="Print">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          Print
        </button>
        <span class="divider"></span>
        <button id="btn-download-png" class="primary-btn" title="Download as PNG">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          PNG
        </button>
        <button id="btn-download-jpeg" class="primary-btn" title="Download as JPEG">JPEG</button>
        <button id="btn-download-pdf" class="primary-btn" title="Download as PDF">PDF</button>
        <span class="divider"></span>
        <button id="btn-options" class="icon-btn" title="Options">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </header>

    <div id="main">
      <aside id="toolbar">
        <button class="tool-btn active" data-tool="select" title="Select / move (V)">
          <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18.5z"/></svg>
        </button>
        <button class="tool-btn" data-tool="crop" title="Crop (C)">
          <svg viewBox="0 0 24 24"><path d="M17 15h2V7c0-1.1-.9-2-2-2H9v2h8v8zM7 17V1H5v4H1v2h4v10c0 1.1.9 2 2 2h10v4h2v-4h4v-2H7z"/></svg>
        </button>
        <div class="tool-sep"></div>
        <button class="tool-btn" data-tool="pen" title="Pen (P)">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        <button class="tool-btn" data-tool="highlight" title="Highlighter (H)">
          <svg viewBox="0 0 24 24"><path d="M6 14l3 3v5h6v-5l3-3V9H6v5zm5-12h2v3h-2V2zM3.5 5.88l1.41-1.41 2.12 2.12L5.62 8 3.5 5.88zm13.46.71l2.12-2.12 1.41 1.41L18.38 8l-1.42-1.41z"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Line (L)">
          <svg viewBox="0 0 24 24"><path d="M19.07 4.93l-14.14 14.14 1.41 1.41L20.48 6.34z"/></svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
          <svg viewBox="0 0 24 24"><path d="M5 17.59L15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
          <svg viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10z"/></svg>
        </button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse (E)">
          <svg viewBox="0 0 24 24"><path d="M12 4C6.5 4 2 7.58 2 12s4.5 8 10 8 10-3.58 10-8-4.5-8-10-8zm0 14c-4.41 0-8-2.69-8-6s3.59-6 8-6 8 2.69 8 6-3.59 6-8 6z"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text (T)">
          <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
        </button>
        <button class="tool-btn" data-tool="blur" title="Blur / redact (B)">
          <svg viewBox="0 0 24 24"><path d="M6 13c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm4 8.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm0-13c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zM10 7c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0 10c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm8-3.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm-4 3.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-9.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm0 5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm4 2c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-8 2c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
        </button>
        <div class="tool-sep"></div>
        <div id="color-swatches">
          <button class="swatch active" data-color="#e8352a" style="background:#e8352a" title="Red"></button>
          <button class="swatch" data-color="#ff9800" style="background:#ff9800" title="Orange"></button>
          <button class="swatch" data-color="#ffe100" style="background:#ffe100" title="Yellow"></button>
          <button class="swatch" data-color="#34a853" style="background:#34a853" title="Green"></button>
          <button class="swatch" data-color="#1a73e8" style="background:#1a73e8" title="Blue"></button>
          <button class="swatch" data-color="#a142f4" style="background:#a142f4" title="Purple"></button>
          <button class="swatch" data-color="#111111" style="background:#111111" title="Black"></button>
          <button class="swatch" data-color="#ffffff" style="background:#ffffff;border-color:#999" title="White"></button>
          <input type="color" id="color-custom" value="#e8352a" title="Custom color">
        </div>
        <div class="tool-sep"></div>
        <label id="stroke-label" title="Stroke width">
          <input type="range" id="stroke-width" min="1" max="24" value="4">
        </label>
        <div class="spacer"></div>
        <button id="btn-delete" class="tool-btn" title="Delete selection (Del)" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </aside>

      <div id="stage-wrap">
        <div id="loading">
          <div class="spinner"></div>
          <div id="loading-text">Stitching screenshot…</div>
        </div>
        <canvas id="stage" tabindex="0"></canvas>
        <div id="crop-bar" hidden>
          <span>Drag to select the crop area</span>
          <button id="crop-apply" class="primary-btn" disabled>Apply crop</button>
          <button id="crop-cancel" class="text-btn">Cancel</button>
        </div>
        <textarea id="text-input" hidden spellcheck="false" placeholder="Type here…"></textarea>
      </div>
    </div>

    <footer id="statusbar">
      <span id="status-dims"></span>
      <span id="status-msg"></span>
      <span class="spacer"></span>
      <span id="status-hint">Scroll to pan · Ctrl+scroll to zoom · Ctrl+Z undo</span>
    </footer>
  </div>

  <script type="module" src="editor.js"></script>
</body>
</html>
